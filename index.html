<!DOCTYPE html>  
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Grupo Viggo · Pesquisa de Reação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0F;
    --bezel:#000000;
    --surface:#15151C;
    --surface-2:#1D1D26;
    --ink:#F4F3F7;
    --ink-soft:#9C97A8;
    --ink-faint:#615C6E;
    --line:#28262F;
    --line-soft:#1E1C24;
    --violet:#7C5CFF;
    --cyan:#22D3EE;
    --grad: linear-gradient(135deg, var(--violet), var(--cyan));
    --red:#F2545B;
    --amber:#F5B942;
    --green:#33D999;
    --radius:20px;
    --shadow: 0 20px 46px -18px rgba(0,0,0,0.65);
    --shadow-sm: 0 6px 18px -8px rgba(0,0,0,0.55);
    --glow: 0 0 0 1px rgba(124,92,255,0.25), 0 8px 24px -10px rgba(124,92,255,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(820px 420px at 15% -10%, rgba(124,92,255,0.16), transparent 62%),
      radial-gradient(700px 420px at 105% 0%, rgba(34,211,238,0.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:22px 14px;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(700px 500px at 50% 0%, black, transparent 75%);
    mask-image: radial-gradient(700px 500px at 50% 0%, black, transparent 75%);
    pointer-events:none;
  }

  .device{
    position:relative;
    width:100%; max-width:400px;
    background: linear-gradient(180deg,#000000,#0A0A0F);
    border-radius:44px;
    padding:14px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05) inset;
  }
  .screen{
    position:relative;
    background:var(--bg);
    border-radius:32px;
    overflow:hidden;
    min-height:calc(100vh - 76px);
    display:flex; flex-direction:column;
    box-shadow: 0 0 0 1px rgba(124,92,255,0.12) inset;
  }
  .notch{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:84px; height:20px; background:#000; border-radius:12px; z-index:5;
  }

  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px 6px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--ink-soft);
  }
  .statusbar .clock{ letter-spacing:.02em; color:var(--ink); }
  .statusbar .carrier{ color:var(--ink-faint); font-weight:500; letter-spacing:.03em; }
  .sb-right{ display:flex; align-items:center; gap:6px; }
  .signal-ic{ display:flex; align-items:flex-end; gap:2px; height:9px; }
  .signal-ic i{ width:3px; border-radius:1px; background:var(--line); display:block; }
  .signal-ic i:nth-child(1){height:35%;}
  .signal-ic i:nth-child(2){height:55%;}
  .signal-ic i:nth-child(3){height:75%;}
  .signal-ic i:nth-child(4){height:100%;}
  .battery{ width:19px; height:10px; border:1.3px solid var(--ink-faint); border-radius:2.5px; position:relative; }
  .battery::after{ content:""; position:absolute; right:-3.5px; top:2.5px; width:2px; height:4px; background:var(--ink-faint); border-radius:0 1px 1px 0;}
  .battery i{ position:absolute; top:1px; left:1px; bottom:1px; background:var(--ink-soft); border-radius:1px; }

  .content{ flex:1; display:flex; flex-direction:column; padding:6px 20px 22px; }

  .brandbar{ display:flex; align-items:center; justify-content:space-between; margin:10px 0 16px; }
  .brandmark{ display:flex; align-items:center; gap:10px; user-select:none; }
  .brandmark .icwrap{
    width:32px;height:32px;border-radius:9px;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--line);
  }
  .brandmark .icwrap img{ width:15px; height:auto; display:block; }
  .brandmark .txt{ font-family:'Sora',sans-serif; font-weight:700; font-size:13.5px; line-height:1.15; color:var(--ink); }
  .brandmark .txt span{ display:block; font-family:'Inter'; font-weight:500; font-size:10px; color:var(--ink-faint); }
  .kpi-tag{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.07em;
    color:var(--cyan); background:rgba(34,211,238,0.08); padding:4px 9px; border-radius:999px;
    border:1px solid rgba(34,211,238,0.22);
  }

  .steplabel{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); letter-spacing:.03em; margin-bottom:16px; }
  .steplabel b{color:var(--ink);}

  .card{
    background:var(--surface); border-radius:var(--radius); padding:22px 18px;
    box-shadow:var(--shadow); border:1px solid var(--line);
    flex:1; display:flex; flex-direction:column;
  }
  .card.enter-fwd{ animation: slideFwd .38s cubic-bezier(.2,.7,.3,1); }
  .card.enter-back{ animation: slideBack .38s cubic-bezier(.2,.7,.3,1); }
  @keyframes slideFwd{ from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:none;} }
  @keyframes slideBack{ from{opacity:0; transform:translateX(-16px);} to{opacity:1; transform:none;} }

  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; color:var(--cyan); letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
  h1{ font-family:'Sora',sans-serif; font-size:20.5px; line-height:1.28; font-weight:700; color:var(--ink); margin:0 0 6px; }
  .sub{ color:var(--ink-soft); font-size:13px; line-height:1.5; margin:0 0 18px; }

  .q{ margin-bottom:24px; }
  .q:last-child{ margin-bottom:6px; }
  .q label.qtitle{ display:block; font-weight:600; font-size:14px; color:var(--ink); margin-bottom:12px; line-height:1.4; }

  input[type=text]{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
    font-family:'Inter'; font-size:14px; color:var(--ink); background:var(--surface-2);
  }
  input[type=text]::placeholder{ color:var(--ink-faint); }
  input[type=text]:focus{ outline:none; border-color:var(--violet); }

  .segopts{ display:flex; flex-direction:column; gap:9px; }
  .segopt{
    position:relative; overflow:hidden;
    border:1.5px solid var(--line); border-radius:14px; padding:13px 14px;
    display:flex; align-items:center; gap:12px; cursor:pointer; background:var(--surface-2);
    transition: border-color .15s, background .15s, transform .1s;
  }
  .segopt:active{ transform:scale(0.99); }
  .segopt .ic{
    width:38px;height:38px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg); color:var(--ink-soft);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .segopt .ic svg{ width:19px; height:19px; }
  .segopt .lb{ font-weight:600; font-size:13.5px; color:var(--ink); }
  .segopt .ds{ font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .segopt.sel{ border-color:transparent; background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box, var(--grad) border-box; }
  .segopt.sel .ic{ background:var(--grad); color:#0A0A0F; box-shadow:none; }
  .segopt .check{ margin-left:auto; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line); flex:none; }
  .segopt.sel .check{ border-color:transparent; background:var(--grad); position:relative; }
  .segopt.sel .check::after{ content:""; position:absolute; inset:0; margin:auto; width:5px; height:8px; border:solid #0A0A0F; border-width:0 2px 2px 0; transform:translate(1px,-1px) rotate(45deg); }

  .likert{ position:relative; display:flex; background:var(--surface-2); border-radius:13px; padding:4px; box-shadow:inset 0 0 0 1px var(--line); }
  .likert .thumb{
    position:absolute; top:4px; bottom:4px; width:calc(20% - 4px); border-radius:9px;
    background:var(--grad);
    box-shadow: var(--glow);
    transition: transform .25s cubic-bezier(.2,.7,.3,1), opacity .2s;
    opacity:0;
  }
  .likert button{
    position:relative; z-index:1; flex:1; padding:11px 0; border:none; background:transparent;
    font-family:'Sora',sans-serif; font-weight:700; font-size:14px; color:var(--ink-faint); cursor:pointer;
    transition:color .2s;
  }
  .likert button.sel{ color:#0A0A0F; }
  .likertlabels{ display:flex; justify-content:space-between; margin-top:8px; }
  .likertlabels span{ font-size:10px; color:var(--ink-faint); max-width:96px; line-height:1.3; }
  .likertlabels span:last-child{ text-align:right; }

  .nps{ display:flex; flex-wrap:wrap; gap:5px; }
  .nps button{
    width:15.6%; aspect-ratio:1/1; min-width:34px; border-radius:10px; border:1.5px solid transparent;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; color:#0A0A0F; cursor:pointer;
    opacity:.6; transition: opacity .15s, transform .1s, border-color .15s;
  }
  .nps button.sel{ opacity:1; border-color:var(--ink); transform:scale(1.06); }

  textarea{
    width:100%; min-height:86px; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
    font-family:'Inter'; font-size:13.5px; color:var(--ink); background:var(--surface-2); resize:vertical;
  }
  textarea::placeholder{ color:var(--ink-faint); }
  textarea:focus{ outline:none; border-color:var(--violet); }

  .navrow{ display:flex; gap:10px; margin-top:20px; }
  .btn{ flex:1; padding:14px; border-radius:14px; border:none; font-family:'Sora',sans-serif; font-weight:700; font-size:14px; cursor:pointer; transition: transform .1s, opacity .15s, box-shadow .15s; }
  .btn:active{ transform:scale(0.98); }
  .btn.primary{ background:var(--grad); color:#0A0A0F; box-shadow:var(--glow);}
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); flex:0 0 88px;}
  .btn:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; }
  .hint{ font-size:11px; color:var(--red); margin-top:9px; min-height:13px; }

  .thanks{ text-align:center; padding:22px 4px 6px; }
  .thanks .ic{ font-size:40px; margin-bottom:12px; }
  .thanks h1{ text-align:center; }
  .thanks .sub{ text-align:center; }

  .badge17{ display:flex; align-items:center; justify-content:center; gap:8px; margin:2px 0 18px; opacity:.85;}
  .badge17 img{ height:22px; width:auto; }
  .badge17 span{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-faint); letter-spacing:.06em; }

  .dash{ margin-top:16px; }
  .kpirow{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-soft);}
  .kpirow:last-child{ border-bottom:none; }
  .kpirow .lb{ flex:1; font-size:12px; font-weight:600; color:var(--ink); }
  .kpirow .lb small{ display:block; font-weight:500; color:var(--ink-faint); font-size:10px; }
  .kpirow .val{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14.5px; color:var(--ink); }
  .bar{ height:5px; border-radius:3px; background:var(--line); overflow:hidden; width:100%; margin-top:5px;}
  .bar i{ display:block; height:100%; background:var(--grad); }
  .n-resp{ font-size:10.5px; color:var(--ink-faint); margin-top:14px; text-align:center; }

  .gauge{ position:relative; width:96px; height:96px; margin:4px auto 4px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .gauge .in{ width:74px; height:74px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow: inset 0 0 0 1px var(--line);}
  .gauge .in b{ font-family:'Sora',sans-serif; font-size:19px; color:var(--ink); }
  .gauge .in span{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; color:var(--ink-faint); letter-spacing:.05em;}

  .home-indicator{ display:flex; justify-content:center; padding:10px 0 2px; }
  .home-indicator i{ width:110px; height:4px; border-radius:3px; background:rgba(255,255,255,0.14); }

  .hero-wordmark{ display:flex; justify-content:center; margin:2px 0 18px; }
  .hero-wordmark img{ height:26px; width:auto; }

  /* ===== admin / report view ===== */
  body.admin-mode{ display:block; padding:0; }
  body.admin-mode .device{ display:none; }
  .admin-shell{
    max-width:980px; margin:0 auto; padding:32px 20px 60px;
    font-family:'Inter',sans-serif;
  }
  .admin-header{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:22px; }
  .admin-actions{ display:flex; gap:10px; }
  .admin-summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .admin-scard{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px;
    display:flex; flex-direction:column; gap:4px; box-shadow:var(--shadow-sm);
  }
  .admin-scard b{ font-family:'Sora',sans-serif; font-size:26px; color:var(--ink); }
  .admin-scard span{ font-size:11.5px; color:var(--ink-soft); }
  .admin-card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px;
    margin-bottom:16px; box-shadow:var(--shadow-sm);
  }
  .admin-kgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-top:6px; }
  .admin-kcard{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .admin-kval{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:19px; color:var(--ink); }
  .admin-kval span{ font-size:11px; color:var(--ink-faint); font-weight:500; }
  .admin-klabel{ font-size:11px; color:var(--ink-soft); margin:4px 0 8px; }
  .admin-table-wrap{ overflow-x:auto; margin-top:6px; }
  .admin-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .admin-table th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .admin-table td{ padding:9px 10px; border-bottom:1px solid var(--line-soft); color:var(--ink); vertical-align:top; }
  .admin-table tbody tr:hover{ background:var(--surface-2); }
  .admin-comment{ max-width:260px; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="device">
  <div class="notch"></div>
  <div class="screen">
    <div id="app"></div>
  </div>
</div>

  window.__setSeg = function(v){ state.segmento=v; render(); };
  window.__field = function(id,v){ state[id]=v; };
  window.__textq = function(id,v){ state.r[id]=v; };

  function likert(id, question){
    const v = state.r[id];
    const idx = v ? v-1 : 0;
    let btns='';
    for(let i=1;i<=5;i++){
      btns += `<button type="button" class="${v===i?'sel':''}" onclick="window.__setLikert('${id}',${i})">${i}</button>`;
    }
    return `
      <div class="q">
        <label class="qtitle">${question}</label>
        <div class="likert">
          <div class="thumb" style="opacity:${v?1:0}; transform:translateX(${idx*100}%)"></div>
          ${btns}
        </div>
        <div class="likertlabels"><span>Discordo totalmente</span><span>Concordo totalmente</span></div>
      </div>`;
  }

  function npsColor(i){
    const hue = Math.round((i/10)*130);
    return `hsl(${hue}, 72%, 52%)`;
  }

  function npsWidget(id, question, lowLb, highLb){
    const v = state.r[id];
    let btns='';
    for(let i=0;i<=10;i++){
      btns += `<button type="button" style="background:${npsColor(i)}" class="${v===i?'sel':''}" onclick="window.__setNps('${id}',${i})">${i}</button>`;
    }
    return `
      <div class="q">
        <label class="qtitle">${question}</label>
        <div class="nps">${btns}</div>
        <div class="likertlabels"><span>${lowLb}</span><span>${highLb}</span></div>
      </div>`;
  }

  function signalIcon(step){
    const idx = STEPS.indexOf(step);
    const lit = Math.max(1, Math.ceil((idx+1)/(totalMainSteps/4)));
    let bars='';
    for(let i=0;i<4;i++){
      const on = i<lit;
      const style = on ? `background:linear-gradient(180deg, var(--violet), var(--cyan))` : '';
      bars += `<i style="${style}"></i>`;
    }
    return `<div class="signal-ic">${bars}</div>`;
  }

  function statusBar(step){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    return `
    <div class="statusbar">
      <div class="clock">${hh}:${mm}</div>
      <div class="carrier">VIGGO</div>
      <div class="sb-right">
        ${signalIcon(step)}
        <div class="battery"><i style="width:70%"></i></div>
      </div>
    </div>`;
  }

  function header(step, code, label){
    return `
    ${statusBar(step)}
    <div class="brandbar">
      <div class="brandmark" id="brandtap">
        <div class="icwrap"><img src="${LOGO_ICON}" alt="Grupo Viggo"></div>
        <div class="txt">Grupo Viggo<span>Treinamento &amp; Desenvolvimento</span></div>
      </div>
      <div class="kpi-tag">${code}</div>
    </div>
    <div class="steplabel">Etapa <b>${STEPS.indexOf(step)+1}</b> de ${totalMainSteps} · ${label}</div>
    `;
  }

  function validStep(){
    switch(state.step){
      case 0: return !!state.segmento;
      case 1: return [1,2].every(n=>state.r['q'+n]!=null);
      case 2: return [3,4].every(n=>state.r['q'+n]!=null);
      case 3: return [5].every(n=>state.r['q'+n]!=null);
      case 4: return [6,7].every(n=>state.r['q'+n]!=null);
      case 5: return [8,9].every(n=>state.r['q'+n]!=null);
      case 6: return state.r['q10']!=null;
      default: return true;
    }
  }

  function nav(showBack){
    const ok = validStep();
    const isLast = STEPS[state.step] === 'final';
    return `
      <div class="navrow">
        ${showBack ? `<button class="btn ghost" onclick="window.__back()">Voltar</button>` : ''}
        <button class="btn primary" ${ok?'':'disabled'} onclick="window.__next()">${isLast ? 'Enviar pesquisa' : 'Avançar'}</button>
      </div>
      <div class="hint">${ok ? '' : 'Responda todos os itens para continuar.'}</div>
    `;
  }

  function render(){
    const app = document.getElementById('app');
    const step = STEPS[state.step];
    const animClass = state.dir === 'back' ? 'enter-back' : 'enter-fwd';
    let inner = '';

    if(step === 'id'){
      inner = `
        <div class="hero-wordmark"><img src="${LOGO_WORDMARK}" alt="Grupo Viggo"></div>
        <div class="eyebrow">Antes de começar</div>
        <h1>Pesquisa de reação</h1>

          <label class="qtitle">Qual seu segmento de atuação?</label>
          <div class="segopts">
            ${SEGMENTOS.map(s=>`

                <div><div class="lb">${s.lb}</div><div class="ds">${s.ds}</div></div>
                <div class="check"></div>
              </div>`).join('')}

        <div class="q">
          <label class="qtitle">Nome (opcional)</label>

        <h1>Quem conduziu sua formação</h1>
        <p class="sub">Avalie de 1 (discordo totalmente) a 5 (concordo totalmente).</p>
        ${likert('q3','O instrutor demonstrou domínio do conteúdo e conduziu a turma com clareza e dinamismo.')}
        ${likert('q4','Minhas dúvidas foram esclarecidas de forma satisfatória.')}

        ${likert('q7','Consigo colocar em prática, com segurança, o que foi apresentado no treinamento.')}
        ${nav(true)}`;
      app.innerHTML = `<div class="content">${header(step,'AP · Aplicabilidade','Aplicabilidade prática')}<div class="card ${animClass}">${inner}</div></div>`;
    }

    else if(step === 'confianca'){
      inner = `
        <div class="eyebrow">Índice de Confiança</div>
        <h1>Sua confiança para atuar</h1>
        <p class="sub">1 = muito baixa · 5 = muito alta.</p>
        ${likert('q8','Antes deste treinamento, como você avaliava sua confiança para atuar nesta função/área?')}
        ${likert('q9','Depois deste treinamento, sinto-me confiante e pronto(a) para colocar em prática minhas atividades.')}
        ${nav(true)}`;
      app.innerHTML = `<div class="content">${header(step,'CF · Confiança','Autoavaliação')}<div class="card ${animClass}">${inner}</div></div>`;
    }

    else if(step === 'final'){
      inner = `
        <div class="eyebrow">Satisfação Geral</div>
        <h1>Sua reação geral</h1>
        <div class="q">
          <label class="qtitle">Comentário breve sobre o treinamento (opcional)</label>
          <textarea placeholder="O que você achou? Alguma sugestão?" oninput="window.__textq('q11', this.value)">${state.r.q11||''}</textarea>
        </div>
        ${npsWidget('q10','De forma geral, qual sua satisfação com este treinamento?','Muito insatisfeito(a)','Muito satisfeito(a)')}
        ${nav(true)}`;
      app.innerHTML = `<div class="content">${header(step,'SG · Satisfação','Reação geral')}<div class="card ${animClass}">${inner}</div></div>`;
    }

    else if(step === 'fim'){
      app.innerHTML = `
        <div class="content">
          ${statusBar(step)}
          <div class="brandbar">
            <div class="brandmark" id="brandtap">
              <div class="icwrap"><img src="${LOGO_ICON}" alt="Grupo Viggo"></div>
              <div class="txt">Grupo Viggo<span>Treinamento &amp; Desenvolvimento</span></div>
            </div>
          </div>
          <div class="card thanks ${animClass}">
            <div class="ic">✅</div>
            <h1>Pesquisa enviada!</h1>
            <p class="sub">Obrigado por ajudar o time de treinamento do Grupo Viggo a evoluir cada formação. Bora pra cima! 🚀</p>
            <div class="badge17"><img src="${LOGO_BADGE17}" alt="17 anos"><span>17 ANOS NO MERCADO</span></div>
          </div>
        </div>`;
      let taps=0,lastTap=0;
      document.getElementById('brandtap').addEventListener('click', ()=>{
        const now=Date.now();
        if(now-lastTap>2500) taps=0;
        lastTap=now; taps++;
        if(taps>=5){ taps=0; location.href = location.pathname + '?admin=1'; }
      });
    }

    const hi = document.createElement('div');
    hi.className='home-indicator';
    hi.innerHTML = '<i></i>';
    app.appendChild(hi);
  }

  window.__next = async function(){
    if(!validStep()) return;
    state.dir='fwd';
    if(STEPS[state.step] === 'final'){
      await submitSurvey();
      state.step++;
      render();
      return;
    }
    state.step++;
    render();
  };
  window.__back = function(){ state.dir='back'; state.step=Math.max(0,state.step-1); render(); };

async function submitSurvey(){

  const payload = {
    ts:new Date().toISOString(),
    nome:state.nome,
    turma:state.turma,
    segmento:state.segmento,

    q1: state.r.q1 || '',
    q2: state.r.q2 || '',
    q3: state.r.q3 || '',
    q4: state.r.q4 || '',
    q5: state.r.q5 || '',
    q6: state.r.q6 || '',
    q7: state.r.q7 || '',
    q8: state.r.q8 || '',
    q9: state.r.q9 || '',
    q10: state.r.q10 || '',
    q11: state.r.q11 || ''
  };

  await fetch('/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: new URLSearchParams({
      'form-name': 'avaliacao-reacao',
      ...payload
    }).toString()
  });

}

  function avg(arr){ const v=arr.filter(x=>typeof x==='number'); return v.length ? (v.reduce((a,b)=>a+b,0)/v.length) : null; }

  // ===================== VISÃO ADMINISTRATIVA =====================
  let allResponses = [];

  function fmtDate(iso){
    try{ const d = new Date(iso); return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return iso || '—'; }
  }

  function segLabel(v){
    const s = SEGMENTOS.find(x=>x.v===v);
    return s ? s.lb : (v || '—');
  }

  function computeKpis(rows){
    const get = (id)=> rows.map(a=> a.respostas ? a.respostas[id] : undefined);
    const irc = avg([...get('q1'),...get('q2')]);
    const idi = avg([...get('q3'),...get('q4')]);
    const isi = avg(get('q5'));
    const iap = avg([...get('q6'),...get('q7')]);
    const confAntes = avg(get('q8'));
    const confDepois = avg(get('q9'));
    const satVals = get('q10').filter(x=>typeof x==='number');
    let nps = null, satMedia = null;
    if(satVals.length){
      const prom = satVals.filter(v=>v>=9).length;
      const det = satVals.filter(v=>v<=6).length;
      nps = Math.round(((prom-det)/satVals.length)*100);
      satMedia = satVals.reduce((a,b)=>a+b,0)/satVals.length;
    }
    return {irc,idi,isi,iap,confAntes,confDepois,satMedia,nps,n:rows.length};
  }

  function csvEscape(v){
    const s = (v===undefined||v===null) ? '' : String(v);
    return '"' + s.replace(/"/g,'""') + '"';
  }

  function downloadCSV(){
    const headers = ['Data/Hora','Nome','Turma','Segmento',
      'Conteudo_claro_aplicavel(q1)','Tempo_adequado(q2)',
      'Instrutor_dominio_condução(q3)','Duvidas_esclarecidas(q4)',
      'Infraestrutura_materiais(q5)',
      'Aplicabilidade_canal(q6)','Aplicabilidade_geral(q7)',
      'Confianca_antes(q8)','Confianca_depois(q9)',
      'Satisfacao_geral_0a10(q10)','Comentario(q11)'];
    const lines = [headers.map(csvEscape).join(',')];
    allResponses.forEach(r=>{
      const rr = r.respostas || {};
      lines.push([
        fmtDate(r.ts), r.nome, r.turma, segLabel(r.segmento),
        rr.q1, rr.q2, rr.q3, rr.q4, rr.q5, rr.q6, rr.q7, rr.q8, rr.q9, rr.q10, rr.q11
      ].map(csvEscape).join(','));
    });
    const csv = lines.join('\r\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'respostas_grupo_viggo_'+Date.now()+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  async function loadAllResponses(){
    const list = await window.storage.list('resposta:', true);
    const keys = (list && list.keys) || [];
    const all = [];
    for(const k of keys){
      try{ const res = await window.storage.get(k, true); if(res) all.push(JSON.parse(res.value)); }catch(e){}
    }
    all.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
    return all;
  }

  function kpiCard(label, val, max){
    const pct = val==null?0:Math.min(100,(val/max)*100);
    return `<div class="admin-kcard">
      <div class="admin-kval">${val==null?'—':val.toFixed(1)}<span>/${max}</span></div>
      <div class="admin-klabel">${label}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }

  async function renderAdmin(){
    const root = document.getElementById('adminApp');
    root.innerHTML = '<p class="sub">Carregando respostas…</p>';
    try{
      allResponses = await loadAllResponses();
      const total = computeKpis(allResponses);
      const bySeg = SEGMENTOS.map(s=>({ seg:s, k: computeKpis(allResponses.filter(r=>r.segmento===s.v)) }));

      root.innerHTML = `
        <div class="admin-header">
          <div class="brandmark">
            <div class="icwrap"><img src="${LOGO_ICON}" alt="Grupo Viggo"></div>
            <div class="txt">Grupo Viggo<span>Painel Administrativo · Treinamento</span></div>
          </div>
          <div class="admin-actions">
            <button class="btn ghost" style="flex:none;width:auto;padding:10px 16px" onclick="window.__reloadAdmin()">Atualizar</button>
            <button class="btn primary" style="flex:none;width:auto;padding:10px 16px" onclick="window.__exportCSV()">Exportar CSV</button>
          </div>
        </div>

        <div class="admin-summary">
          <div class="admin-scard"><b>${total.n}</b><span>Respostas totais</span></div>
          <div class="admin-scard"><b>${total.nps==null?'—':total.nps}</b><span>NPS geral</span></div>
          <div class="admin-scard"><b>${total.satMedia==null?'—':total.satMedia.toFixed(1)}</b><span>Satisfação média (0–10)</span></div>
        </div>

        <div class="admin-card">
          <div class="eyebrow">Indicadores gerais</div>
          <div class="admin-kgrid">
            ${kpiCard('IRC · Conteúdo', total.irc, 5)}
            ${kpiCard('IDI · Instrutor', total.idi, 5)}
            ${kpiCard('ISI · Infraestrutura', total.isi, 5)}
            ${kpiCard('IAP · Aplicabilidade', total.iap, 5)}
            ${kpiCard('Confiança antes', total.confAntes, 5)}
            ${kpiCard('Confiança depois', total.confDepois, 5)}
          </div>
        </div>

        <div class="admin-card">
          <div class="eyebrow">Recorte por segmento</div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr>
                <th>Segmento</th><th>Respostas</th><th>NPS</th><th>Satisfação (0-10)</th><th>IAP</th>
              </tr></thead>
              <tbody>
                ${bySeg.map(x=>`<tr>
                  <td>${x.seg.lb}</td>
                  <td>${x.k.n}</td>
                  <td>${x.k.nps==null?'—':x.k.nps}</td>
                  <td>${x.k.satMedia==null?'—':x.k.satMedia.toFixed(1)}</td>
                  <td>${x.k.iap==null?'—':x.k.iap.toFixed(1)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="admin-card">
          <div class="eyebrow">Respostas recentes</div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr>
                <th>Data</th><th>Nome</th><th>Turma</th><th>Segmento</th><th>Satisfação</th><th>Comentário</th>
              </tr></thead>
              <tbody>
                ${allResponses.slice(0,50).map(r=>`<tr>
                  <td>${fmtDate(r.ts)}</td>
                  <td>${r.nome || '—'}</td>
                  <td>${r.turma || '—'}</td>
                  <td>${segLabel(r.segmento)}</td>
                  <td>${(r.respostas && r.respostas.q10!=null) ? r.respostas.q10 : '—'}</td>
                  <td class="admin-comment">${(r.respostas && r.respostas.q11) ? r.respostas.q11 : '—'}</td>
                </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--ink-faint)">Nenhuma resposta ainda</td></tr>'}
              </tbody>
            </table>
          </div>
          ${allResponses.length>50 ? `<div class="n-resp">Mostrando as 50 respostas mais recentes de ${allResponses.length} · exporte o CSV para ver todas</div>` : ''}
        </div>
      `;
    }catch(e){
      root.innerHTML = '<p class="sub">Não foi possível carregar as respostas agora. Tente atualizar novamente.</p>';
    }
  }

  window.__reloadAdmin = renderAdmin;
  window.__exportCSV = downloadCSV;

  const isAdmin = new URLSearchParams(location.search).has('admin');
  if(isAdmin){
    document.querySelector('.device').style.display = 'none';
    document.body.classList.add('admin-mode');
    const wrap = document.createElement('div');
    wrap.className = 'admin-shell';
    wrap.id = 'adminApp';
    document.body.appendChild(wrap);
    renderAdmin();
  } else {
    render();
    setInterval(()=>{ const c=document.querySelector('.clock'); if(c){ const n=new Date(); c.textContent = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); } }, 15000);
  }
})();
</script>

<form name="avaliacao-reacao" method="POST" netlify hidden>
  <input name="ts">
  <input name="nome">
  <input name="turma">
  <input name="segmento">
  <input name="q1">
  <input name="q2">
  <input name="q3">
  <input name="q4">
  <input name="q5">
  <input name="q6">
  <input name="q7">
  <input name="q8">
  <input name="q9">
  <input name="q10">
  <input name="q11">
</form>

</body>
